<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdolCart - Wishlist & Username Base</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Swiper CSS untuk Slider/Carousel -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #ffffff; padding: 15px; }
        
        /* Card User Telegram */
        .user-card { background: #1e293b; padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; border: 1px solid #334155; }
        .user-card img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }

        /* Style Slider Icon Profil ala App HP */
        .swiper { width: 100%; padding: 10px 0; margin-bottom: 25px; }
        .swiper-slide { width: auto; }
        .app-icon { 
            width: 70px; 
            height: 70px; 
            border-radius: 18px; 
            object-fit: cover; 
            border: 2px solid #3b82f6; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* List Username & Leaderboard */
        .username-card { background: #1e293b; padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e293b; transition: 0.2s; }
        .username-card:hover { border-color: #3b82f6; }
        .badge { background: #3b82f6; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .wish-btn { background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .wish-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Profil Pengunjung Telegram -->
    <div class="user-card">
        <img id="user-photo" src="https://via.placeholder.com/45" alt="Avatar">
        <div>
            <h4 id="user-name">Pengunjung</h4>
            <small id="user-id" style="color: #94a3b8;">@username</small>
        </div>
    </div>

    <!-- Slider Foto Profil Channel Bergeser Otomatis -->
    <h3 style="margin-bottom: 10px; font-size: 16px;">🔥 Base Icon Showcase</h3>
    <div class="swiper myIconsSlider">
        <div class="swiper-wrapper" id="icon-slider-container">
            <!-- Dinamis dari script -->
        </div>
    </div>

    <!-- Leaderboard / List Wishlist -->
    <h3 style="margin-bottom: 12px; font-size: 16px;">🏆 Incaran Username Base</h3>
    <div id="username-list-container">
        <!-- Dinamis dari script -->
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // 1. Inisialisasi Telegram WebApp SDK
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name + ' ' + (user.last_name || '');
            document.getElementById('user-id').innerText = user.username ? '@' + user.username : 'ID: ' + user.id;
            if (user.photo_url) {
                document.getElementById('user-photo').src = user.photo_url;
            }
        }

        // 2. Data Dummy Kaya Variasi (Ratusan Kombinasi Unik Ubah Satu Huruf)
        const fallbackData = [
            { id: 1, group_idol: "K-POP", username: "@idolbase", subscribers: 1420, wish_count: 532, foto_profil: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" },
            { id: 2, group_idol: "K-POP", username: "@idolbas3", subscribers: 980, wish_count: 412, foto_profil: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" },
            { id: 3, group_idol: "K-POP", username: "@idolbasx", subscribers: 760, wish_count: 389, foto_profil: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" },
            { id: 4, group_idol: "J-POP", username: "@idolbaze", subscribers: 1120, wish_count: 350, foto_profil: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150" },
            { id: 5, group_idol: "K-POP", username: "@idolbasq", subscribers: 650, wish_count: 290, foto_profil: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150" },
            { id: 6, group_idol: "THAI", username: "@idolbasi", subscribers: 890, wish_count: 245, foto_profil: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150" },
            { id: 7, group_idol: "K-POP", username: "@idolbasl", subscribers: 540, wish_count: 198, foto_profil: "https://images.unsplash.com/photo-1501196354995-cbb51c65aaea?w=150" },
            { id: 8, group_idol: "GLOBAL", username: "@idolbasp", subscribers: 1230, wish_count: 180, foto_profil: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=150" },
            { id: 9, group_idol: "K-POP", username: "@idolbasz", subscribers: 430, wish_count: 155, foto_profil: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=150" },
            { id: 10, group_idol: "J-POP", username: "@idolbasm", subscribers: 670, wish_count: 130, foto_profil: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" }
        ];

        // 3. Render Data ke HTML
        function renderUI(dataList) {
            const sliderContainer = document.getElementById('icon-slider-container');
            const listContainer = document.getElementById('username-list-container');

            sliderContainer.innerHTML = '';
            listContainer.innerHTML = '';

            dataList.forEach(item => {
                const imgUrl = item.foto_profil || 'https://via.placeholder.com/70';
                
                // Masukkan ke Slider
                sliderContainer.innerHTML += `
                    <div class="swiper-slide">
                        <img src="${imgUrl}" class="app-icon" title="${item.username}">
                    </div>
                `;

                // Masukkan ke Leaderboard List
                listContainer.innerHTML += `
                    <div class="username-card">
                        <div>
                            <span class="badge">${item.group_idol}</span>
                            <div style="font-weight: bold; margin-top: 4px; font-size: 14px;">${item.username}</div>
                            <small style="color: #94a3b8;">Chanel/Subs: ${item.subscribers || 0} | Wish: <span id="wish-${item.id}">${item.wish_count || 0}</span></small>
                        </div>
                        <button class="wish-btn" onclick="tambahWish(${item.id})">+ Wish</button>
                    </div>
                `;
            });

            // Jalankan Slider Bergeser Otomatis
            new Swiper(".myIconsSlider", {
                slidesPerView: "auto",
                spaceBetween: 12,
                loop: true,
                autoplay: {
                    delay: 1500,
                    disableOnInteraction: false,
                },
            });
        }

        // 4. Integrasi Supabase dengan Fallback Aman
        const SUPABASE_URL = "https://ilggrnuwcjqssxhhvolc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_nBFbzV_2TxZ7I9gpUjgBsQ_Z_EzkwU_";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadData() {
            try {
                const { data, error } = await _supabase
                    .from('usernames')
                    .select('*')
                    .order('wish_count', { ascending: false });

                if (error || !data || data.length === 0) {
                    // Jika tabel kosong di Supabase, pakai data cadangan yang kaya variasi
                    renderUI(fallbackData);
                } else {
                    renderUI(data);
                }
            } catch (err) {
                renderUI(fallbackData);
            }
        }

        function tambahWish(id) {
            const spanEl = document.getElementById(`wish-${id}`);
            if (spanEl) {
                let current = parseInt(spanEl.innerText) || 0;
                spanEl.innerText = current + 1;
            }
            tg.showAlert(`Berhasil menambahkan wishlist! ✨`);
        }

        loadData();
    </script>
</body>
</html>
